<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytdl</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<main>
  <header>
    <h1>ytdl</h1>
    <span class="meta"><span class="dot" id="daemonDot"></span> <span id="daemonTxt">—</span></span>
  </header>

  <section>
    <h2>Nuovo download</h2>
    <form id="dl">
      <div class="field">
        <label for="url">Link</label>
        <input id="url" name="url" type="text" placeholder="https://…" required autocomplete="off">
      </div>
      <div class="row">
        <div class="field">
          <label for="format">Formato</label>
          <select id="format"></select>
        </div>
        <div class="field">
          <label for="outDir">Cartella per questo download (opzionale)</label>
          <input id="outDir" type="text" placeholder="predefinita">
        </div>
      </div>
      <div class="checks field">
        <label><input type="checkbox" id="playlist"> Scarica l'intera playlist</label>
      </div>
      <button type="submit" id="go">Scarica</button>
      <div id="msg"></div>
    </form>
  </section>

  <section>
    <h2>In corso</h2>
    <div id="running"><p class="empty">Nessun download in corso.</p></div>
    <h2 style="margin-top:1.1rem">In coda</h2>
    <div id="pending"><p class="empty">Coda vuota.</p></div>
  </section>

  <section>
    <h2>Cronologia recente</h2>
    <div id="history"><p class="empty">Nessun download registrato.</p></div>
  </section>

  <section>
    <details id="settingsBox">
      <summary>Impostazioni</summary>
      <div class="field">
        <label for="sessionOut">Cartella per questa sessione</label>
        <input id="sessionOut" type="text" placeholder="nessun override">
        <div class="hint">Vale finché la GUI resta aperta; non modifica il file di configurazione.</div>
        <p><button type="button" class="secondary" id="saveSession">Applica alla sessione</button></p>
      </div>
      <form id="settings">
        <div class="row">
          <div class="field"><label for="s_outputDir">Cartella predefinita</label><input id="s_outputDir"></div>
          <div class="field"><label for="s_format">Formato</label><select id="s_format"></select></div>
        </div>
        <div class="row">
          <div class="field"><label for="s_audioQuality">Qualità audio (0 = migliore)</label><select id="s_audioQuality"></select></div>
          <div class="field">
            <label for="s_concurrency">Download in parallelo</label>
            <input id="s_concurrency" type="number" min="1">
            <div class="checks" style="margin-top:.35rem">
              <label><input type="checkbox" id="s_noLimit"> senza limite (sconsigliato)</label>
            </div>
          </div>
        </div>
        <div class="field"><label for="s_nameTemplate">Template del nome file</label><input id="s_nameTemplate"></div>
        <div class="row">
          <div class="field"><label for="s_stripBrackets">Rimuovi (regex, parentesi quadre)</label><input id="s_stripBrackets"></div>
          <div class="field"><label for="s_stripTags">Rimuovi (regex, tag ridondanti)</label><input id="s_stripTags"></div>
        </div>
        <div class="row">
          <div class="field"><label for="s_logDir">Cartella dei log</label><input id="s_logDir"></div>
          <div class="field"><label for="s_logRetentionDays">Giorni di storico (0 = per sempre)</label><input id="s_logRetentionDays" type="number" min="0"></div>
        </div>
        <div class="field"><label for="s_notifyOn">Notifica quando</label><select id="s_notifyOn"></select></div>
        <div class="checks field">
          <label><input type="checkbox" id="s_playlistDefault"> Playlist per impostazione predefinita</label>
          <label><input type="checkbox" id="s_embedThumbnail"> Incorpora copertina</label>
          <label><input type="checkbox" id="s_embedMetadata"> Incorpora metadati</label>
          <label><input type="checkbox" id="s_breadcrumbOnFailure"> Lascia un .log accanto all'audio se fallisce</label>
          <label><input type="checkbox" id="s_notify"> Notifiche di sistema</label>
          <label><input type="checkbox" id="s_notifyForeground"> Notifica anche in primo piano</label>
          <label><input type="checkbox" id="s_notifySound"> Suono della notifica</label>
        </div>
        <button type="submit" id="saveSettings">Salva impostazioni</button>
        <div id="settingsMsg"></div>
      </form>
    </details>
  </section>
</main>

</body>
</html>
