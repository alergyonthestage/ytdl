name: release

# On a v* tag: cross-compile the macOS binaries from Linux (no macOS runner, no
# lipo), publish them with a yt-dlp-format SHA2-256SUMS, and cut a "latest"
# release so the installer's releases/latest/download/… URLs resolve
# (design-cycle1-remaining.md §4.2).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The suite, on the TAGGED tree, before anything is published.
  #
  # ci.yml and release.yml are independent workflows: a tag push starts this one
  # immediately, whatever CI is doing on the same commit — so a red tree could be,
  # and was, released. What was released was sound (the failure was in three tests,
  # not in the product), but that was luck rather than a property.
  #
  # This does not replace the human gate. `releasing.md` says the suite is a
  # precondition and never the evidence, and gate C is still the maintainer's hands
  # on real hardware. It only makes the precondition actually precede.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Ship release binaries built with a currently-supported Go toolchain,
          # not an EOL line with unpatched stdlib. go.mod keeps the 1.22 floor.
          go-version: 'stable'

      - name: Cross-compile darwin/arm64 + darwin/amd64
        run: |
          mkdir -p dist
          ldflags="-s -w -X github.com/alergyonthestage/ytdl/internal/buildinfo.Version=${GITHUB_REF_NAME}"
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" -o "dist/ytdl_macos_${arch}" ./cmd/ytdl
            # The launcher inside YTDL.app. It carries no version: install.sh
            # compares it by CHECKSUM, so a release that does not change its bytes
            # must not change them (ADR-0019 §1, design §4.3).
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "dist/ytdl_launch_macos_${arch}" ./cmd/ytdl-launch
          done

      # macOS 26 refuses an unsigned arm64 Mach-O as a bundle executable, and the
      # only signature this pipeline can produce is the ad-hoc one the Go linker
      # applies to darwin/arm64 by itself. If a toolchain change ever stopped
      # emitting it, YTDL.app would be published dead and nothing before gate C
      # would say so — so the release fails here instead.
      #
      # darwin/amd64 is deliberately NOT checked: x86_64 macOS requires no
      # signature and the linker emits none, which is why ytdl_macos_amd64 has
      # shipped unsigned since 2.0.0 and runs (ADR-0019 §1).
      - name: Assert the arm64 launcher is linker-signed
        run: |
          python3 - <<'EOF'
          import struct, sys

          LC_CODE_SIGNATURE = 0x1D
          path = "dist/ytdl_launch_macos_arm64"
          data = open(path, "rb").read()

          magic, = struct.unpack("<I", data[:4])
          if magic != 0xFEEDFACF:
              sys.exit(f"{path}: not a 64-bit little-endian Mach-O ({magic:#x})")

          ncmds, = struct.unpack("<I", data[16:20])
          off, signed = 32, False
          for _ in range(ncmds):
              cmd, size = struct.unpack("<II", data[off:off + 8])
              if size == 0:
                  sys.exit(f"{path}: malformed load command at {off}")
              signed = signed or cmd == LC_CODE_SIGNATURE
              off += size

          if not signed:
              sys.exit(f"{path}: no LC_CODE_SIGNATURE — macOS would refuse it as a bundle executable")
          print(f"{path}: LC_CODE_SIGNATURE present")
          EOF

      - name: Checksums (yt-dlp SHA2-256SUMS format)
        working-directory: dist
        run: |
          sha256sum \
            ytdl_macos_arm64 ytdl_macos_amd64 \
            ytdl_launch_macos_arm64 ytdl_launch_macos_amd64 > SHA2-256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --latest \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/ytdl_macos_arm64 dist/ytdl_macos_amd64 \
            dist/ytdl_launch_macos_arm64 dist/ytdl_launch_macos_amd64 \
            dist/SHA2-256SUMS
