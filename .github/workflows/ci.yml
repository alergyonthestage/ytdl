name: ci

# Build and test on every push and PR to main. The golden tests use fake
# yt-dlp/ffmpeg shims, so no real downloader/encoder is needed — the job is pure
# Go (design-cycle1-remaining.md §4.1).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # TWO ARCHITECTURES, and the second one is not symmetry for its own sake.
    #
    # FetchPin resolves the ffmpeg build for the machine it runs on
    # (internal/update/probe.go), and three tests asserted one architecture's build
    # id unconditionally. They were green on the maintainer's arm64 container and
    # red here from the day the pin gained per-architecture keys — main's CI was red
    # for ten days and the local gate could not see it, because the local gate runs
    # ONE architecture and always the same one.
    #
    # The maintainer develops on arm64 and CI ran amd64: whichever single one is
    # chosen, the other is the blind spot. Running both is what removes the class
    # rather than remembering it.
    strategy:
      # Never stop the other architecture: which one fails, and whether BOTH do, is
      # the whole diagnostic value here.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Build/test with a currently-supported Go line. go.mod still declares
          # the 1.22 language floor; this only pins the toolchain that compiles it,
          # keeping it off Go's EOL releases (and their unpatched stdlib).
          go-version: 'stable'

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # release.yml cross-compiles the macOS binaries from Linux; verify that
      # still succeeds here so a darwin-only break (a linux-only import, a
      # GOOS-specific syscall field) surfaces as a PR failure instead of a
      # dangling-tag failure after the release tag is already pushed.
      - name: cross-compile darwin (arm64 + amd64)
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -o /dev/null ./cmd/ytdl
          done

      # The installer's own logic (platform detection, asset selection, checksum
      # verification) is pure bash with no macOS-only deps, so it runs here too.
      - name: installer tests
        run: |
          bash -n install.sh
          bash tests/test-installer.sh
