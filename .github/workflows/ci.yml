name: ci

# Build and test on every push and PR to main. The golden tests use fake
# yt-dlp/ffmpeg shims, so no real downloader/encoder is needed — the job is pure
# Go (design-cycle1-remaining.md §4.1).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The installer's own logic (platform detection, asset selection, checksum
      # verification) is pure bash with no macOS-only deps, so it runs here too.
      - name: installer tests
        run: |
          bash -n install.sh
          bash tests/test-installer.sh
