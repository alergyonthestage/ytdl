# What ytdl requires — maintainer-managed (ADR-0016 §2).
#
# One `key = value` per line; lines starting with # are comments. This file is
# READ, never sourced: install.sh parses it with awk against a whitelist, exactly
# as ytdl parses its own config file. Anything not listed below is refused.
#
# Changing this file is the one lever this project never had. Because the verdict
# compares each machine against THIS file, a commit here reaches every existing
# installation within a day — with no release and no new binary.

# ── yt-dlp ────────────────────────────────────────────────────────────────────
#
# Accepts "latest" or an exact tag. Writing a tag here is the rollback lever.
#
# The policy starts at "latest" deliberately (ADR-0016 §2). The two failure modes
# are not symmetric: a yt-dlp too old for a YouTube change happens several times a
# year, is loud, and self-heals the moment the user updates — while a new yt-dlp
# breaking ytdl is rare, and is undone by pinning a tag here after the fact. The
# lever works retroactively for the second; nothing works retroactively for the
# first. The scheduled canary is what makes a loose policy safe to hold.
#
# yt-dlp needs no checksum here: its release publishes a per-release
# SHA2-256SUMS, which the installer verifies against.
yt_dlp_version              = latest

# ── ffmpeg ────────────────────────────────────────────────────────────────────
#
# Pinned hard, and there is deliberately no "latest": an exact, immutable build is
# what makes the checksums below mean anything (ADR-0016 §12). ytdl never invokes
# ffmpeg itself — yt-dlp does — and its interface does not move, so pinning costs
# nothing recurring.
#
# One build id PER ARCHITECTURE: upstream builds macOS arm64 and amd64 separately
# and stamps them with different ids, so a single value could not describe both
# (verified 2026-08-13 — both are ffmpeg 9.0).
ffmpeg_build_arm64          = 1785863997_9.0
ffmpeg_build_amd64          = 1785871427_9.0

# sha256 of the exact zips the build ids above resolve to.
#
# This is the MAINTAINER's attestation of builds they fetched and tested, not an
# upstream signature: martin-riedl publishes no sums we consume. It guarantees
# IMMUTABILITY — every user gets the identical artefact — not provenance. That is
# strictly more than the nothing this channel offered before, and it is the most
# it can offer (ADR-0016 §12).
ffmpeg_sha256_arm64_ffmpeg  = 5267ef149ee0d208057a1b316aac079b661b0476574dee5da7d225769773c603
ffmpeg_sha256_arm64_ffprobe = 7778fbb533fb60d3336cbd9a9e51eced71658f020b570c7203590c1c41d42f50
ffmpeg_sha256_amd64_ffmpeg  = 79d14663d8b078dbbc38de18d63a30f8a5bfc860af5dfee7f8cf3e387cf1c02c
ffmpeg_sha256_amd64_ffprobe = a2dd3f2e7eb35a10fa6ac43b1a8c21890f27bee0dc4a86ddee16a57d72d3898d
